<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68" role="img" aria-label="BIM QUEST">
  <defs>
    <linearGradient id="bqCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bqCubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f4c81" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="bqCubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Isometric Game-Style 3D BIM Block Icon -->
  <g transform="translate(6, 4)">
    <!-- Outer Hex Shield -->
    <polygon points="30,2 56,17 56,47 30,62 4,47 4,17" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
    <!-- Isometric Roof / Top Slab -->
    <polygon points="30,8 50,20 30,32 10,20" fill="url(#bqCubeTop)" />
    <!-- Isometric Left Wall -->
    <polygon points="10,20 30,32 30,54 10,42" fill="url(#bqCubeLeft)" />
    <!-- Isometric Right Wall with Door Cutout -->
    <polygon points="30,32 50,20 50,42 43,46.2 43,35 36,39.2 36,50.4 30,54" fill="url(#bqCubeRight)" />
    <!-- Isometric Blueprint Grid Lines -->
    <polyline points="30,8 30,32 50,20" fill="none" stroke="#e0f2fe" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="30" cy="32" r="2.5" fill="#ffffff" />
  </g>

  <!-- Game Title Wordmark -->
  <g transform="translate(74, 0)">
    <text x="0" y="37" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="currentColor">
      BIM<tspan fill="#f97316">QUEST</tspan>
    </text>
    <rect x="1" y="45" width="76" height="16" rx="4" fill="#0284c7" fill-opacity="0.18" />
    <text x="7" y="56" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10" font-weight="700" letter-spacing="1.2" fill="#0284c7">
      3D STUDIO
    </text>
    <text x="86" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">
      OYNA · KUR · ÖĞREN
    </text>
  </g>
</svg>
