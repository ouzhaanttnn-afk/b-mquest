name: BIM QUEST — iOS Build & TestFlight Upload

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  APPSTORE_KEY_ID: SNPBS4JDJA
  BUNDLE_ID: com.bimquest.studio
  APPLE_TEAM_ID: 8X6KZC5R23
  PROFILE_UUID: 7209d8fa-e0b5-405c-9078-ee5521d89cdc

jobs:
  checks:
    name: Type check, tests, web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test -- --retry=2
      - run: npm run build

  build-and-upload-testflight:
    name: Build iOS (.ipa) & Upload to TestFlight
    needs: checks
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: 3. Install Dependencies, Test & Build Web Bundle
        working-directory: ./app
        run: |
          npm ci
          npm test -- --retry=2
          npm run build
          npx cap sync ios

      - name: 4. Import Apple Distribution Certificate & Provisioning Profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/bimquest-signing.keychain-db"
          KEYCHAIN_PASS="bimquest-ci-keychain-pass"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

      - name: 5. Archive & Export Signed iOS (.ipa)
        working-directory: ./app/ios/App
        run: |
          set -euo pipefail
          BUILD_NUM="${GITHUB_RUN_NUMBER}"

          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BIMQuest.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

          cat <<EOF > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BIMQuest.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

          ls -lh "$RUNNER_TEMP/export"

      - name: 6. Upload Signed .ipa Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BIMQuest-iOS-IPA-build-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: 7. Upload .ipa to Apple TestFlight (App Store Connect API)
        env:
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"

          IPA_FILE=$(ls "$RUNNER_TEMP/export/"*.ipa | head -n 1)
          echo "Validating $IPA_FILE..."
          xcrun altool --validate-app \
            --file "$IPA_FILE" \
            --type ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo "Uploading $IPA_FILE to TestFlight..."
          xcrun altool --upload-app \
            --file "$IPA_FILE" \
            --type ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: 8. Cleanup Ephemeral Keychain & Keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/bimquest-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"
